services:
  - type: web
    name: ai-powered-ticket-routing-system
    runtime: docker
    # Persistent disks require a paid web-service plan on Render.
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    disk:
      name: ticket-routing-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: PORT
        value: "10000"
      - key: FLASK_PORT
        value: "10000"
      - key: FLASK_HOST
        value: "0.0.0.0"
      - key: DATABASE_PATH
        value: /var/data/platform.db
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: DEMO_ADMIN_EMAIL
        value: recruiter.demo@ticketrouting.app
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: INFO
